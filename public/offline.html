<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>오프라인 | BYTE BACK 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; --bg: #101a28; --text: #ecf4ff; --text-muted: #bfd0e5; --accent: #8ad8df; --on-accent: #101a28; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    main { max-width: 560px; margin: 0 auto; padding: 56px 22px; }
    h1 { margin: 0 0 16px; font-size: 28px; line-height: 1.3; }
    p { font-size: 17px; line-height: 1.7; color: var(--text-muted); }
    a { display: inline-flex; align-items: center; min-height: 40px; margin-top: 12px; padding: 8px 16px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; }
    a:hover { filter: brightness(1.1); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (pointer: coarse) { a { min-height: 44px; } }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>인터넷에 연결되어 있지 않아 자료실을 열 수 없습니다. 이 화면에는 메모가 저장되어 있지 않고, 로그인과 메모 요청은 연결된 뒤에 다시 시도해야 합니다.</p>
    <p>이 앱을 설치했더라도 기기 승인은 서버와 판정기가 정하며, 오프라인 상태에서는 확인할 수 없습니다.</p>
    <a href="/">연결 후 다시 열기</a>
  </main>
</body>
</html>
